<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Ah Carbón! Hamburguesas · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141b16; --panel:#1d2720; --line:#2f3d33; --text:#f3efe6; --muted:#a9b3a8;
  --accent:#ee9a3c; --accent-ink:#1a1204; --tag:#62f26e; --tag-ink:#0c2a10; --danger:#ff8a7a;
  --head:'Anton','Impact','Arial Narrow',sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f6f1e7;--panel:#fffaf0;--line:#e3d9c4;--text:#1d2418;--muted:#6a705f;--accent:#c9701a;--accent-ink:#fff;--tag:#4be05a;--tag-ink:#0c2a10;--danger:#b3261e}
}
:root[data-theme="dark"]{--bg:#141b16;--panel:#1d2720;--line:#2f3d33;--text:#f3efe6;--muted:#a9b3a8}
:root[data-theme="light"]{--bg:#f6f1e7;--panel:#fffaf0;--line:#e3d9c4;--text:#1d2418;--muted:#6a705f;--accent:#c9701a;--accent-ink:#fff;--tag:#4be05a;--tag-ink:#0c2a10;--danger:#b3261e}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:110px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header{padding:22px 0 10px}
.logo{font-family:var(--head);font-size:44px;line-height:.95;letter-spacing:.5px;margin:0;font-weight:400;overflow-wrap:break-word}
.logo small{display:block;font-size:26px;color:var(--accent);margin-top:4px}
.sub{color:var(--muted);margin:10px 0 0;font-size:15px}

nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;margin:0 -16px;border-bottom:1px solid var(--line)}
nav.cats a{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:800;font-size:14px;background:var(--panel)}

section{padding-top:22px}
h2{font-family:var(--head);font-weight:400;font-size:28px;letter-spacing:.5px;color:var(--accent);margin:0 0 6px;overflow-wrap:break-word}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item h3{margin:0;font-size:17px;font-weight:800}
.item p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price{background:var(--tag);color:var(--tag-ink);font-family:var(--head);font-size:22px;line-height:1;padding:6px 10px 5px;border-radius:8px;transform:rotate(-3deg);letter-spacing:.5px}
.step{display:flex;align-items:center;gap:0;border:2px solid var(--accent);border-radius:99px;overflow:hidden;background:var(--panel)}
.step button{width:40px;height:38px;border:0;background:transparent;font-size:22px;font-weight:800;color:var(--accent)}
.step b{min-width:26px;text-align:center;font-size:17px}
.add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:99px;height:38px;padding:0 18px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar button{width:100%;max-width:560px;display:flex;margin:0 auto;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;padding:15px 18px}
.bar[hidden]{display:none}

.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none}
.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:30px}
.close{float:right;border:1px solid var(--line);background:var(--panel);border-radius:99px;width:38px;height:38px;font-size:18px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line span{flex:1}
.line em{font-style:normal;color:var(--muted);font-size:14px;margin-right:6px}
.total{display:flex;justify-content:space-between;font-family:var(--head);font-size:28px;padding:14px 0 6px}
label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
textarea{min-height:68px;resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-weight:800}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.err{color:var(--danger);font-weight:800;font-size:14px;margin:10px 0 0;min-height:18px}
.send{width:100%;margin-top:12px;border:0;border-radius:14px;background:#25d366;color:#06240f;font-weight:800;font-size:18px;padding:16px}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0;text-align:center}
.done{text-align:center;padding:10px 0}
.done .big{font-size:54px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px}
.banner{display:block;width:100%;aspect-ratio:3/2;height:auto;object-fit:cover;border-radius:14px;margin:4px 0 6px}
.info{display:flex;gap:12px;align-items:flex-start}
.thumb{flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:14.5px}
.note strong{display:block}
footer{text-align:center;color:var(--muted);font-size:13px;padding:26px 0 0}

/* panel del negocio */
.owner textarea{min-height:170px;font-size:14px}
.owner .row{display:flex;gap:8px;margin-top:10px}
.owner .row button{flex:1}
.ghost{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;font-weight:800}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.card b{font-size:18px}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<div class="bar" id="bar" hidden><button id="openCart"><span id="barCount"></span><span id="barTotal"></span></button></div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Tu pedido"><div class="in" id="sheet"></div></div></div>

<script>
/* =========================================================
   CONFIGURACIÓN — para replicar en otro negocio solo se
   cambia este bloque (nombre, teléfono y menú).
   ========================================================= */
/* IMÁGENES: archivos dentro de la carpeta img/ (junto a index.html).
   Para agregar una foto a un producto: img: "img/nombre.jpg".
   Si una imagen no carga, simplemente no se muestra. */
const IMG = { hamb: "img/hamburguesas.jpg", hotdogs: "img/hot-dogs.jpg", refresco: "img/refresco.jpg" };

const NEGOCIO = {
  nombre: "¡Ah Carbón! Hamburguesas",
  whatsapp: "527228647706",           // lada país + número, sin + ni espacios
  mensajeInicio: "Arma tu pedido y envíalo por WhatsApp. Te confirmamos por ahí.",
  notaRecoger: "Todos los pedidos son para recoger en tienda. Te avisamos por WhatsApp cuando esté listo.",
  menu: [
    { cat: "Hamburguesas", img: IMG.hamb, items: [
      { n: "Sencilla", p: 75, d: "Carne, queso amarillo, queso Oaxaca, jitomate, cebolla, lechuga, chiles toreados y aderezos" },
      { n: "Doble Carne", p: 90, d: "Doble carne, queso amarillo, queso Oaxaca, jitomate, cebolla, lechuga, chiles toreados y aderezos" },
      { n: "Arrachera", p: 110, d: "Arrachera, queso amarillo, queso Oaxaca, jitomate, cebolla, lechuga, chiles toreados y aderezos" },
      { n: "Hawaiana", p: 85, d: "Carne, jamón, piña, queso amarillo, queso Oaxaca, jitomate, cebolla, lechuga, chiles toreados y aderezos" },
      { n: "Cubana", p: 110, d: "Carne, pierna ahumada, salchicha, tocino, jamón, piña, queso amarillo, queso Oaxaca, jitomate, cebolla, lechuga, chiles toreados y aderezos" }
    ]},
    { cat: "Especiales", items: [
      { n: "Doble Carne Cubana", p: 135 },
      { n: "Doble Carne Hawaiana", p: 110 },
      { n: "Doble Arrachera Cubana", p: 175 },
      { n: "Doble Arrachera Hawaiana", p: 170 },
      { n: "Arrachera Cubana", p: 135 },
      { n: "Arrachera Hawaiana", p: 125 },
      { n: "Arrachera Doble Carne", p: 155 },
      { n: "Ingrediente extra", p: 5 }
    ]},
    { cat: "Hot-dog", img: IMG.hotdogs, items: [
      { n: "Hot-dog sencillo", p: 35, d: "Salchicha, jitomate, cebolla, lechuga, chiles toreados y aderezos" },
      { n: "Hot-dog con tocino", p: 40, d: "Salchicha, tocino, jitomate, cebolla, lechuga, chiles toreados y aderezos" },
      { n: "Hot-dog Jumbo", p: 45, d: "Tocino, queso Oaxaca, jitomate, cebolla, lechuga, chiles toreados y aderezos" }
    ]},
    { cat: "Para compartir", items: [
      { n: "Papas a la francesa con salchicha", p: 45 },
      { n: "Alitas BBQ", p: 90 },
      { n: "Alitas Búfalo", p: 90 },
      { n: "Alitas Mango Habanero", p: 90 },
      { n: "Boneless con papas", p: 115 }
    ]},
    { cat: "Bebidas", items: [
      { n: "Refresco", p: 25, img: IMG.refresco }
    ]}
  ]
};
/* ========================================================= */

const $ = s => document.querySelector(s);
const money = n => "$" + n;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");

// índice plano de productos
const ITEMS = [];
NEGOCIO.menu.forEach(c => c.items.forEach(i => { i.id = slug(i.n); ITEMS.push(i); }));
const byId = id => ITEMS.find(i => i.id === id);

// estado
let cart = {};            // id -> cantidad
let form = { nombre:"", tel:"", notas:"" };
let folio = null;
try { const s = JSON.parse(localStorage.getItem("ac_form")||"null"); if (s) { form.nombre = s.nombre||""; form.tel = s.tel||""; } } catch(e){}

const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
const total = () => Object.entries(cart).reduce((a,[id,q]) => a + byId(id).p*q, 0);

/* ---------- MENÚ ---------- */
function renderMenu(){
  const cats = NEGOCIO.menu.map(c => `<a href="#${slug(c.cat)}">${esc(c.cat)}</a>`).join("");
  const secs = NEGOCIO.menu.map(c => `
    <section id="${slug(c.cat)}"><h2>${esc(c.cat)}</h2>${c.img?`<img class="banner" src="${c.img}" alt="${esc(c.cat)}" loading="lazy" onerror="this.remove()">`:""}
    ${c.items.map(i => `
      <div class="item">
        <div class="info">${i.img?`<img class="thumb" src="${i.img}" alt="" loading="lazy" onerror="this.remove()">`:""}<div><h3>${esc(i.n)}</h3>${i.d?`<p>${esc(i.d)}</p>`:""}</div></div>
        <div class="right"><span class="price">${money(i.p)}</span><div data-ctl="${i.id}"></div></div>
      </div>`).join("")}
    </section>`).join("");
  $("#app").innerHTML = `
    <header>
      <h1 class="logo">${esc(NEGOCIO.nombre.replace(" Hamburguesas",""))}<small>Hamburguesas</small></h1>
      <p class="sub">${esc(NEGOCIO.mensajeInicio)}</p>
      <div class="note"><span aria-hidden="true">🏪</span><span><strong>Solo para recoger en tienda</strong>${esc(NEGOCIO.notaRecoger)}</span></div>
    </header>
    <nav class="cats" aria-label="Categorías">${cats}</nav>
    ${secs}
    <footer>Pedidos con anticipación · <button class="link" id="ownerLink">Panel del negocio</button></footer>`;
  ITEMS.forEach(paintCtl);
  $("#ownerLink").onclick = () => { location.hash = "negocio"; route(); };
  paintBar();
}
function ctlHTML(id){
  const q = cart[id]||0;
  return q ? `<div class="step"><button data-m="${id}" aria-label="Quitar uno">−</button><b>${q}</b><button data-p="${id}" aria-label="Agregar uno">+</button></div>`
           : `<button class="add" data-p="${id}">Agregar</button>`;
}
function paintCtl(i){ const el = document.querySelector(`[data-ctl="${i.id}"]`); if (el) el.innerHTML = ctlHTML(i.id); }
function change(id, d){
  cart[id] = Math.max(0,(cart[id]||0)+d); if(!cart[id]) delete cart[id];
  paintCtl(byId(id)); paintBar();
  if ($("#sheetBg").classList.contains("open")) renderSheet(true);
}
function paintBar(){
  const n = count();
  $("#bar").hidden = !n;
  $("#barCount").textContent = `Ver pedido (${n})`;
  $("#barTotal").textContent = money(total());
}

/* ---------- PEDIDO ---------- */
function openSheet(){ $("#sheetBg").classList.add("open"); renderSheet(); }
function closeSheet(){ $("#sheetBg").classList.remove("open"); }

function renderSheet(keepFocus){
  if (!count()){ closeSheet(); return; }
  const lines = Object.entries(cart).map(([id,q]) => { const i = byId(id); return `
    <div class="line"><span>${esc(i.n)} <em>${money(i.p)}</em></span>
      <div class="step"><button data-m="${id}" aria-label="Quitar uno">−</button><b>${q}</b><button data-p="${id}" aria-label="Agregar uno">+</button></div>
    </div>`; }).join("");
  const active = keepFocus ? document.activeElement : null;
  const keep = active && active.id ? active.id : null;
  const caret = keep ? active.selectionStart : null;
  $("#sheet").innerHTML = `
    <button class="close" id="closeSheet" aria-label="Cerrar">✕</button>
    <h2>Tu pedido</h2>
    ${lines}
    <div class="total"><span>Total</span><span>${money(total())}</span></div>

    <label for="f_nombre">Tu nombre</label>
    <input type="text" id="f_nombre" autocomplete="given-name" value="${esc(form.nombre)}">

    <label for="f_tel">Tu WhatsApp (10 dígitos)</label>
    <input type="tel" id="f_tel" inputmode="numeric" autocomplete="tel-national" placeholder="722 000 0000" value="${esc(form.tel)}">

    <div class="note"><span aria-hidden="true">🏪</span><span><strong>Recoges en tienda</strong>${esc(NEGOCIO.notaRecoger)}</span></div>

    <label for="f_notas">Notas (sin cebolla, sin picante…)</label>
    <textarea id="f_notas">${esc(form.notas)}</textarea>

    <p class="err" id="err" role="alert"></p>
    <button class="send" id="send">Enviar pedido por WhatsApp</button>
    <p class="hint">Se abre WhatsApp con tu pedido listo. Solo toca enviar.</p>`;
  if (keep){ const el = document.getElementById(keep); if (el){ el.focus(); try{ el.setSelectionRange(caret,caret);}catch(e){} } }
}

function normTel(t){
  const d = String(t).replace(/\D/g,"");
  if (d.length===10) return "52"+d;
  if (d.length===12 && d.startsWith("52")) return d;
  if (d.length===13 && d.startsWith("521")) return "52"+d.slice(3);
  return null;
}
function buildMessage(){
  folio = String(Math.floor(100+Math.random()*900));
  const rows = Object.entries(cart).map(([id,q]) => { const i = byId(id); return `${q} x ${i.n} — ${money(i.p*q)}`; });
  const tel = normTel(form.tel);
  return [
    `*${NEGOCIO.nombre}*`,
    `Pedido #${folio}`,
    `Nombre: ${form.nombre.trim()}`,
    `WhatsApp: ${tel.slice(2)}`,
    `Tipo: Recoger en tienda`,
    ``,
    ...rows,
    ``,
    `*Total: ${money(total())}*`,
    form.notas.trim() ? `Notas: ${form.notas.trim()}` : null
  ].filter(x => x!==null).join("\n");
}
function send(){
  const err = $("#err");
  if (!form.nombre.trim()) return err.textContent = "Escribe tu nombre.";
  if (!normTel(form.tel)) return err.textContent = "Escribe tu WhatsApp a 10 dígitos.";
  try { localStorage.setItem("ac_form", JSON.stringify({nombre:form.nombre, tel:form.tel})); } catch(e){}
  const url = `https://wa.me/${NEGOCIO.whatsapp}?text=${encodeURIComponent(buildMessage())}`;
  $("#sheet").innerHTML = `
    <div class="done">
      <div class="big">✅</div>
      <h2>Pedido #${folio} listo para enviar</h2>
      <p>Si WhatsApp no se abrió, toca el botón. Te confirmaremos por ahí cuando lo recibamos y cuando esté listo para recoger en tienda.</p>
      <a class="send" style="display:block;text-decoration:none;text-align:center" href="${url}" target="_blank" rel="noopener">Abrir WhatsApp</a>
      <p><button class="link" id="newOrder">Hacer otro pedido</button></p>
    </div>`;
  window.open(url, "_blank");
  $("#newOrder").onclick = () => { cart = {}; form.notas=""; ITEMS.forEach(paintCtl); paintBar(); closeSheet(); window.scrollTo(0,0); };
}

/* ---------- PANEL DEL NEGOCIO ---------- */
function renderOwner(){
  $("#bar").hidden = true;
  $("#app").innerHTML = `
    <header><h1 class="logo">Panel<small>del negocio</small></h1>
    <p class="sub">Copia el pedido que te llegó por WhatsApp, pégalo aquí y avisa al cliente con un toque.</p></header>
    <div class="owner">
      <label for="paste">Pedido recibido</label>
      <textarea id="paste" placeholder="Pega aquí el mensaje del pedido"></textarea>
      <div class="row"><button class="ghost" id="pasteBtn">Pegar</button><button class="ghost" id="clearBtn">Limpiar</button></div>
      <div id="result"></div>
      <p style="margin-top:22px"><button class="link" id="backLink">← Volver al menú</button></p>
    </div>`;
  $("#paste").oninput = parseOwner;
  $("#clearBtn").onclick = () => { $("#paste").value=""; parseOwner(); };
  $("#pasteBtn").onclick = async () => { try { $("#paste").value = await navigator.clipboard.readText(); parseOwner(); } catch(e){ $("#paste").focus(); } };
  $("#backLink").onclick = () => { location.hash = ""; route(); };
}
function parseOwner(){
  const t = $("#paste").value;
  const folioM = t.match(/Pedido #(\w+)/), nom = t.match(/Nombre:\s*(.+)/), tel = t.match(/WhatsApp:\s*([\d\s+-]+)/);
  const tot = t.match(/Total:\s*\$?(\d+)/);
  const out = $("#result");
  if (!folioM || !nom || !tel){ out.innerHTML = t.trim() ? `<p class="err">No encuentro folio, nombre o WhatsApp en ese texto.</p>` : ""; return; }
  const n = nom[1].replace(/\*/g,"").trim(), f = folioM[1], num = normTel(tel[1]);
  if (!num){ out.innerHTML = `<p class="err">El número del cliente no es válido.</p>`; return; }
  const wa = msg => `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  const recibido = `¡Hola ${n}! Recibimos tu pedido #${f}${tot?` por $${tot[1]}`:""} ✅ Ya lo estamos preparando. Te avisamos en cuanto esté listo.`;
  const listo = `¡${n}, tu pedido #${f} ya está listo! 🍔🔥 Puedes pasar por él a la tienda.`;
  out.innerHTML = `
    <div class="card"><b>#${esc(f)} · ${esc(n)}</b><div style="color:var(--muted)">${tot?money(tot[1])+" · ":""}Recoger en tienda</div>
      <a class="send" style="display:block;text-decoration:none;text-align:center" href="${wa(recibido)}" target="_blank" rel="noopener">✅ Avisar: pedido recibido</a>
      <a class="send" style="display:block;text-decoration:none;text-align:center;background:var(--accent);color:var(--accent-ink)" href="${wa(listo)}" target="_blank" rel="noopener">🍔 Avisar: pedido listo</a>
    </div>`;
}

/* ---------- eventos y rutas ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.p) change(t.dataset.p, 1);
  else if (t.dataset.m) change(t.dataset.m, -1);
  else if (t.id==="openCart") openSheet();
  else if (t.id==="closeSheet") closeSheet();
  else if (t.id==="send") send();
});
document.addEventListener("input", e => {
  const m = {f_nombre:"nombre", f_tel:"tel", f_notas:"notas"}[e.target.id];
  if (m) form[m] = e.target.value;
});
$("#sheetBg").addEventListener("click", e => { if (e.target.id==="sheetBg") closeSheet(); });
function route(){ closeSheet(); location.hash==="#negocio" ? renderOwner() : renderMenu(); }
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
